<?xml version="1.0" encoding="UTF-8"?>
<!-- gb-player (GoBro) application icon: a camera lens whose glass shows a "little planet" 360° view,
     with an orange GPS route winding over the planet. SPDX-License-Identifier: GPL-3.0-or-later -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3340"/>
      <stop offset="1" stop-color="#151a22"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9dee6"/>
      <stop offset="0.45" stop-color="#7d8794"/>
      <stop offset="1" stop-color="#3a414c"/>
    </linearGradient>
    <radialGradient id="sky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.35" stop-color="#bfe6ff"/>
      <stop offset="0.75" stop-color="#3d9be0"/>
      <stop offset="1" stop-color="#174a8c"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#8fd16a"/>
      <stop offset="0.7" stop-color="#3f9a45"/>
      <stop offset="1" stop-color="#22652f"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="glass"><circle cx="128" cy="128" r="78"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#tile)"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="51.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- lens barrel -->
  <circle cx="128" cy="128" r="100" fill="url(#ring)"/>
  <circle cx="128" cy="128" r="90" fill="#0c0f14"/>
  <circle cx="128" cy="128" r="84" fill="none" stroke="#2c333d" stroke-width="3"/>

  <!-- glass: little-planet scene -->
  <g clip-path="url(#glass)">
    <circle cx="128" cy="128" r="78" fill="url(#sky)"/>
    <!-- sun -->
    <circle cx="170" cy="86" r="9" fill="#fff4c2"/>
    <!-- trees standing on the planet, pointing outwards -->
    <g>
      <line x1="124.9" y1="92.1" x2="123.6" y2="78.2" stroke="#5a3b22" stroke-width="3" stroke-linecap="round"/>
      <circle cx="123.2" cy="72.6" r="8" fill="#1f6b33"/>
      <line x1="100.4" y1="104.9" x2="92.8" y2="98.4" stroke="#5a3b22" stroke-width="3" stroke-linecap="round"/>
      <circle cx="89.3" cy="95.5" r="6.5" fill="#1f6b33"/>
      <line x1="157.5" y1="107.4" x2="166.5" y2="101.0" stroke="#5a3b22" stroke-width="3" stroke-linecap="round"/>
      <circle cx="170.5" cy="98.2" r="7" fill="#1f6b33"/>
      <line x1="92.5" y1="134.3" x2="83.7" y2="135.8" stroke="#5a3b22" stroke-width="3" stroke-linecap="round"/>
      <circle cx="79.5" cy="136.5" r="6" fill="#1f6b33"/>
      <line x1="148.6" y1="157.5" x2="155.5" y2="167.3" stroke="#5a3b22" stroke-width="3" stroke-linecap="round"/>
      <circle cx="158.5" cy="171.6" r="7.5" fill="#1f6b33"/>
    </g>
    <!-- planet -->
    <circle cx="128" cy="128" r="38" fill="url(#planet)"/>
    <!-- GPS route -->
    <path d="M104 146 C 112 120, 136 150, 140 128 S 128 104, 150 110"
          fill="none" stroke="#ff8a1f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="104" cy="146" r="5" fill="#ffffff"/>
    <circle cx="150" cy="110" r="6" fill="#ff8a1f" stroke="#ffffff" stroke-width="2.5"/>
    <!-- glass reflection -->
    <ellipse cx="112" cy="84" rx="52" ry="30" fill="url(#glare)" transform="rotate(-25 112 84)"/>
  </g>
  <circle cx="128" cy="128" r="78" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2"/>
</svg>
