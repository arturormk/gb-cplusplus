name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    # Same Ubuntu release and pinned clang-format as quickstart.sh, so local and CI output agree.
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout v7.0.1; immutable upstream commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-15
      - name: Check formatting
        run: scripts/format.sh --check

  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout v7.0.1; immutable upstream commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history: odd-minor versions count commits (ADR-0010).
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libavformat-dev libavcodec-dev libavfilter-dev libavutil-dev libswscale-dev \
            qt6-base-dev libqt6opengl6-dev qt6-declarative-dev libqt6shadertools6-dev qt6-shader-baker \
            qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-nativestyle qml6-module-qtquick-templates \
            qml6-module-qtquick-window libsdl2-dev
      - name: Configure
        run: cmake --preset dev -DGB_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev
