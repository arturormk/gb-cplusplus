name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout v7.0.1; immutable upstream commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure
        run: cmake --preset dev -DGB_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev
